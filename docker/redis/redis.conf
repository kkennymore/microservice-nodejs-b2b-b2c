# Redis configuration for marketplace platform

# Network
bind 0.0.0.0
port 6379
timeout 0
tcp-keepalive 300

# General
daemonize no
supervised no
loglevel notice
logfile ""

# Snapshotting
save 900 1
save 300 10
save 60 10000

# Security
# requirepass yourpasswordhere
protected-mode no

# Memory management
maxmemory 128mb
maxmemory-policy allkeys-lru

# Append only file
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Disable dangerous commands in production
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command SHUTDOWN SHUTDOWN_REDIS

# Disable RDB snapshots in development (optional)
# save ""

# Enable Redis Cluster (optional)
# cluster-enabled yes
# cluster-config-file nodes.conf
# cluster-node-timeout 5000