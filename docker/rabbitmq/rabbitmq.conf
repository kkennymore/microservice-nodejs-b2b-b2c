# RabbitMQ configuration for marketplace platform

# Network
listeners.tcp.default = 5672
management.tcp.port = 15672
management.tcp.ip = 0.0.0.0

# Security
loopback_users.guest = false

# Resource limits
vm_memory_high_watermark.relative = 0.8
disk_free_limit.relative = 1.0

# Clustering (single node for now)
cluster_formation.peer_discovery_backend = rabbit_peer_discovery_classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq

# Message store
# msg_store_file_size_limit = 17179869184  # Removed: invalid setting for current RabbitMQ version

# Logging
log.file = true
log.file.level = info
log.console.level = info

# Performance tuning
channel_max = 2047
connection_max = 2048
consumer_timeout = 1800000

# Heartbeat
heartbeat = 60

# SSL (disabled for development)
# ssl_options.certfile = /path/to/cert.pem
# ssl_options.keyfile = /path/to/key.pem
# ssl_options.cacertfile = /path/to/ca.pem
# listeners.ssl.default = 5671