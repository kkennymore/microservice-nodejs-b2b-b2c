apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-config
  namespace: marketplace
data:
  rabbitmq.conf: |
    # RabbitMQ configuration for marketplace
    listeners.tcp.default = 5672
    management.tcp.port = 15672
    management.tcp.ip = 0.0.0.0

    # Memory and disk settings
    vm_memory_high_watermark.absolute = 512MB
    disk_free_limit.absolute = 2GB

    # Heartbeat timeout
    heartbeat = 60

    # Clustering (disabled for single node)
    cluster_formation.peer_discovery_backend = classic_config

    # Logging
    log.file = true
    log.file.level = info
    log.console.level = info

    # Security
    ssl_options.verify = verify_peer
    ssl_options.fail_if_no_peer_cert = false

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-plugins
  namespace: marketplace
data:
  enabled_plugins: |
    [rabbitmq_management,rabbitmq_prometheus,rabbitmq_shovel,rabbitmq_shovel_management].