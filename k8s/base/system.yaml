apiVersion: apps/v1
kind: Deployment
metadata:
  name: system
  namespace: marketplace
  labels:
    app: system
    component: microservice
spec:
  replicas: 2
  selector:
    matchLabels:
      app: system
  template:
    metadata:
      labels:
        app: system
        component: microservice
    spec:
      containers:
      - name: system
        image: marketplace/system:latest
        ports:
        - containerPort: 3008
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: SYSTEM_PORT
          valueFrom:
            configMapKeyRef:
              name: marketplace-config
              key: SYSTEM_PORT
        - name: JWT_SECRET
          valueFrom:
            configMapKeyRef:
              name: marketplace-config
              key: JWT_SECRET
        - name: DATABASE_HOST
          value: "mysql"
        - name: DATABASE_PORT
          valueFrom:
            configMapKeyRef:
              name: marketplace-config
              key: MYSQL_PORT
        - name: DATABASE_USERNAME
          valueFrom:
            configMapKeyRef:
              name: marketplace-config
              key: MYSQL_USER
        - name: DATABASE_PASSWORD
          valueFrom:
            configMapKeyRef:
              name: marketplace-config
              key: MYSQL_PASSWORD
        - name: DATABASE_NAME
          valueFrom:
            configMapKeyRef:
              name: marketplace-config
              key: MYSQL_DATABASE
        - name: REDIS_HOST
          value: "redis"
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: marketplace-config
              key: REDIS_PORT
        - name: FRONTEND_URL
          valueFrom:
            configMapKeyRef:
              name: marketplace-config
              key: FRONTEND_URL
        # Email alerts
        - name: EMAIL_HOST
          valueFrom:
            configMapKeyRef:
              name: marketplace-config
              key: EMAIL_HOST
        - name: EMAIL_PORT
          valueFrom:
            configMapKeyRef:
              name: marketplace-config
              key: EMAIL_PORT
        - name: EMAIL_USER
          valueFrom:
            configMapKeyRef:
              name: marketplace-config
              key: EMAIL_USER
        - name: EMAIL_PASS
          valueFrom:
            secretKeyRef:
              name: marketplace-secrets
              key: EMAIL_PASS
        - name: ALERT_EMAIL_RECIPIENTS
          valueFrom:
            configMapKeyRef:
              name: marketplace-config
              key: ALERT_EMAIL_RECIPIENTS
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3008
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3008
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: system
  namespace: marketplace
  labels:
    app: system
    component: microservice
spec:
  selector:
    app: system
  ports:
  - port: 3008
    targetPort: 3008
    name: http
  type: ClusterIP