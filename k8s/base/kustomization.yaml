apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: marketplace-base

# Include all resources
resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - persistent-volumes.yaml
  - mysql.yaml
  - mysql-init.yaml
  - redis.yaml
  - redis-config.yaml
  - rabbitmq.yaml
  - rabbitmq-config.yaml
  - gateway.yaml
  - auth.yaml
  - products.yaml
  - transactions.yaml
  - messaging.yaml
  - notifications.yaml
  - advertising.yaml
  - recommender.yaml
  - ticketing.yaml
  - system.yaml
  - analytics.yaml
  - shipping.yaml
  - admin-dashboard.yaml
  - ingress.yaml

# Common labels
labels:
  - pairs:
      app.kubernetes.io/name: marketplace
      app.kubernetes.io/version: "1.0.0"
      app.kubernetes.io/managed-by: kustomize

# Common annotations
commonAnnotations:
  marketplace/version: "1.0.0"
  marketplace/component: platform

# Image transformations
images:
  - name: marketplace/gateway
    newTag: latest
  - name: marketplace/auth
    newTag: latest
  - name: marketplace/products
    newTag: latest
  - name: marketplace/transactions
    newTag: latest
  - name: marketplace/messaging
    newTag: latest
  - name: marketplace/notifications
    newTag: latest
  - name: marketplace/advertising
    newTag: latest
  - name: marketplace/recommender
    newTag: latest
  - name: marketplace/ticketing
    newTag: latest
  - name: marketplace/system
    newTag: latest
  - name: marketplace/analytics
    newTag: latest
  - name: marketplace/shipping
    newTag: latest
  - name: marketplace/admin-dashboard
    newTag: latest