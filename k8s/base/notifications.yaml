apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications
  namespace: marketplace
  labels:
    app: notifications
    component: microservice
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notifications
  template:
    metadata:
      labels:
        app: notifications
        component: microservice
    spec:
      containers:
      - name: notifications
        image: marketplace/notifications:latest
        ports:
        - containerPort: 3005
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: NOTIFICATIONS_PORT
          valueFrom:
            configMapKeyRef:
              name: marketplace-config
              key: NOTIFICATIONS_PORT
        - name: JWT_SECRET
          valueFrom:
            configMapKeyRef:
              name: marketplace-config
              key: JWT_SECRET
        - name: DATABASE_HOST
          value: "mysql"
        - name: DATABASE_PORT
          valueFrom:
            configMapKeyRef:
              name: marketplace-config
              key: MYSQL_PORT
        - name: DATABASE_USERNAME
          valueFrom:
            configMapKeyRef:
              name: marketplace-config
              key: MYSQL_USER
        - name: DATABASE_PASSWORD
          valueFrom:
            configMapKeyRef:
              name: marketplace-config
              key: MYSQL_PASSWORD
        - name: DATABASE_NAME
          valueFrom:
            configMapKeyRef:
              name: marketplace-config
              key: MYSQL_DATABASE
        - name: REDIS_HOST
          value: "redis"
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: marketplace-config
              key: REDIS_PORT
        - name: RABBITMQ_URL
          value: "amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@rabbitmq:5672/$(RABBITMQ_VHOST)"
        - name: FRONTEND_URL
          valueFrom:
            configMapKeyRef:
              name: marketplace-config
              key: FRONTEND_URL
        # Email Configuration
        - name: EMAIL_HOST
          valueFrom:
            configMapKeyRef:
              name: marketplace-config
              key: EMAIL_HOST
        - name: EMAIL_PORT
          valueFrom:
            configMapKeyRef:
              name: marketplace-config
              key: EMAIL_PORT
        - name: EMAIL_USER
          valueFrom:
            configMapKeyRef:
              name: marketplace-config
              key: EMAIL_USER
        - name: EMAIL_PASS
          valueFrom:
            secretKeyRef:
              name: marketplace-secrets
              key: EMAIL_PASS
        - name: ALERT_EMAIL_RECIPIENTS
          valueFrom:
            configMapKeyRef:
              name: marketplace-config
              key: ALERT_EMAIL_RECIPIENTS
        # SMS Configuration
        - name: TWILIO_ACCOUNT_SID
          valueFrom:
            secretKeyRef:
              name: marketplace-secrets
              key: TWILIO_ACCOUNT_SID
        - name: TWILIO_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: marketplace-secrets
              key: TWILIO_AUTH_TOKEN
        - name: TWILIO_PHONE_NUMBER
          valueFrom:
            configMapKeyRef:
              name: marketplace-config
              key: TWILIO_PHONE_NUMBER
        # Push Notification Configuration
        - name: FCM_SERVER_KEY
          valueFrom:
            configMapKeyRef:
              name: marketplace-config
              key: FCM_SERVER_KEY
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3005
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3005
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: notifications
  namespace: marketplace
  labels:
    app: notifications
    component: microservice
spec:
  selector:
    app: notifications
  ports:
  - port: 3005
    targetPort: 3005
    name: http
  type: ClusterIP