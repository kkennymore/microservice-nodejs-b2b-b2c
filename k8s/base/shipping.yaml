apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipping
  namespace: marketplace
  labels:
    app: shipping
    component: microservice
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shipping
  template:
    metadata:
      labels:
        app: shipping
        component: microservice
    spec:
      containers:
      - name: shipping
        image: marketplace/shipping:latest
        ports:
        - containerPort: 3010
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: SHIPPING_PORT
          valueFrom:
            configMapKeyRef:
              name: marketplace-config
              key: SHIPPING_PORT
        - name: JWT_SECRET
          valueFrom:
            configMapKeyRef:
              name: marketplace-config
              key: JWT_SECRET
        - name: DATABASE_HOST
          value: "mysql"
        - name: DATABASE_PORT
          valueFrom:
            configMapKeyRef:
              name: marketplace-config
              key: MYSQL_PORT
        - name: DATABASE_USERNAME
          valueFrom:
            configMapKeyRef:
              name: marketplace-config
              key: MYSQL_USER
        - name: DATABASE_PASSWORD
          valueFrom:
            configMapKeyRef:
              name: marketplace-config
              key: MYSQL_PASSWORD
        - name: DATABASE_NAME
          valueFrom:
            configMapKeyRef:
              name: marketplace-config
              key: MYSQL_DATABASE
        - name: REDIS_HOST
          value: "redis"
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: marketplace-config
              key: REDIS_PORT
        - name: RABBITMQ_URL
          value: "amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@rabbitmq:5672/$(RABBITMQ_VHOST)"
        - name: FRONTEND_URL
          valueFrom:
            configMapKeyRef:
              name: marketplace-config
              key: FRONTEND_URL
        # Shipping Carrier Configuration
        - name: FEDEX_API_KEY
          valueFrom:
            configMapKeyRef:
              name: marketplace-config
              key: FEDEX_API_KEY
        - name: FEDEX_SECRET
          valueFrom:
            secretKeyRef:
              name: marketplace-secrets
              key: FEDEX_SECRET
        - name: UPS_ACCESS_KEY
          valueFrom:
            configMapKeyRef:
              name: marketplace-config
              key: UPS_ACCESS_KEY
        - name: USPS_USERNAME
          valueFrom:
            configMapKeyRef:
              name: marketplace-config
              key: USPS_USERNAME
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3010
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3010
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: shipping
  namespace: marketplace
  labels:
    app: shipping
    component: microservice
spec:
  selector:
    app: shipping
  ports:
  - port: 3010
    targetPort: 3010
    name: http
  type: ClusterIP