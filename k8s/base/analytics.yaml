apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics
  namespace: marketplace
  labels:
    app: analytics
    component: microservice
spec:
  replicas: 2
  selector:
    matchLabels:
      app: analytics
  template:
    metadata:
      labels:
        app: analytics
        component: microservice
    spec:
      containers:
      - name: analytics
        image: marketplace/analytics:latest
        ports:
        - containerPort: 3009
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: ANALYTICS_PORT
          valueFrom:
            configMapKeyRef:
              name: marketplace-config
              key: ANALYTICS_PORT
        - name: JWT_SECRET
          valueFrom:
            configMapKeyRef:
              name: marketplace-config
              key: JWT_SECRET
        - name: DATABASE_HOST
          value: "mysql"
        - name: DATABASE_PORT
          valueFrom:
            configMapKeyRef:
              name: marketplace-config
              key: MYSQL_PORT
        - name: DATABASE_USERNAME
          valueFrom:
            configMapKeyRef:
              name: marketplace-config
              key: MYSQL_USER
        - name: DATABASE_PASSWORD
          valueFrom:
            configMapKeyRef:
              name: marketplace-config
              key: MYSQL_PASSWORD
        - name: DATABASE_NAME
          valueFrom:
            configMapKeyRef:
              name: marketplace-config
              key: MYSQL_DATABASE
        - name: REDIS_HOST
          value: "redis"
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: marketplace-config
              key: REDIS_PORT
        - name: RABBITMQ_URL
          value: "amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@rabbitmq:5672/$(RABBITMQ_VHOST)"
        - name: FRONTEND_URL
          valueFrom:
            configMapKeyRef:
              name: marketplace-config
              key: FRONTEND_URL
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3009
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3009
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: analytics
  namespace: marketplace
  labels:
    app: analytics
    component: microservice
spec:
  selector:
    app: analytics
  ports:
  - port: 3009
    targetPort: 3009
    name: http
  type: ClusterIP