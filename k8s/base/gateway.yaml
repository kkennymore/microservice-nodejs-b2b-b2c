apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: marketplace
  labels:
    app: gateway
    component: api-gateway
spec:
  replicas: 3
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
        component: api-gateway
    spec:
      containers:
      - name: gateway
        image: marketplace/gateway:latest
        ports:
        - containerPort: 9000
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: GATEWAY_PORT
          valueFrom:
            configMapKeyRef:
              name: marketplace-config
              key: GATEWAY_PORT
        - name: JWT_SECRET
          valueFrom:
            configMapKeyRef:
              name: marketplace-config
              key: JWT_SECRET
        - name: FRONTEND_URL
          valueFrom:
            configMapKeyRef:
              name: marketplace-config
              key: FRONTEND_URL
        # Service URLs
        - name: AUTH_SERVICE_URL
          value: "http://auth:9001"
        - name: PRODUCTS_SERVICE_URL
          value: "http://products:9002"
        - name: TRANSACTIONS_SERVICE_URL
          value: "http://transactions:9003"
        - name: MESSAGING_SERVICE_URL
          value: "http://messaging:9004"
        - name: NOTIFICATIONS_SERVICE_URL
          value: "http://notifications:9005"
        - name: ADVERTISING_SERVICE_URL
          value: "http://advertising:9006"
        - name: TICKETING_SERVICE_URL
          value: "http://ticketing:9007"
        - name: REVIEWS_SERVICE_URL
          value: "http://reviews:9008"
        - name: PROMOTIONS_SERVICE_URL
          value: "http://promotions:9009"
        - name: SHIPPING_SERVICE_URL
          value: "http://shipping:9010"
        - name: RECOMMENDER_SERVICE_URL
          value: "http://recommender:9011"
        - name: SYSTEM_SERVICE_URL
          value: "http://system:9012"
        - name: ANALYTICS_SERVICE_URL
          value: "http://analytics:9013"
        - name: WISHLIST_SERVICE_URL
          value: "http://wishlist:9014"
        - name: SEARCH_SERVICE_URL
          value: "http://search:9015"
        - name: SEO_SERVICE_URL
          value: "http://seo:9016"
        - name: LOYALTY_SERVICE_URL
          value: "http://loyalty:9017"
        - name: SOCIAL_SERVICE_URL
          value: "http://social:9018"
        - name: ENHANCED_ANALYTICS_SERVICE_URL
          value: "http://enhanced-analytics:9019"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 9000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 9000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: marketplace
  labels:
    app: gateway
    component: api-gateway
spec:
  selector:
    app: gateway
  ports:
  - port: 9000
    targetPort: 9000
    name: http
  - port: 80
    targetPort: 9000
    name: http-alt
  type: ClusterIP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway-hpa
  namespace: marketplace
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gateway
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80