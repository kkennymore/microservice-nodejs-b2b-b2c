apiVersion: v1
kind: ConfigMap
metadata:
  name: marketplace-config
data:
  FRONTEND_URL: "https://staging.marketplace.example.com"
  ADMIN_PORT: "3000"
  VITE_API_URL: "https://api-staging.marketplace.example.com"

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: marketplace-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-staging"
spec:
  tls:
  - hosts:
    - staging.marketplace.example.com
    - api-staging.marketplace.example.com
    - admin-staging.marketplace.example.com
    secretName: marketplace-staging-tls
  rules:
  - host: api-staging.marketplace.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gateway
            port:
              number: 80
  - host: admin-staging.marketplace.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: admin-dashboard
            port:
              number: 80