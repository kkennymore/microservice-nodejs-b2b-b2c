# Production scaling configuration - higher replica counts and enhanced HPA
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway-hpa
spec:
  minReplicas: 5
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 70

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: products-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: products
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: transactions-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: transactions
  minReplicas: 3
  maxReplicas: 12
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 65

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: analytics-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: analytics
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

---
# Increase base replica counts for production
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 5

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: products
spec:
  replicas: 3

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transactions
spec:
  replicas: 3

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: messaging
spec:
  replicas: 3

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications
spec:
  replicas: 3

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: advertising
spec:
  replicas: 2

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics
spec:
  replicas: 2

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipping
spec:
  replicas: 2

---
# Enhanced resource requests for production
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  template:
    spec:
      containers:
      - name: gateway
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "500m"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics
spec:
  template:
    spec:
      containers:
      - name: analytics
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"