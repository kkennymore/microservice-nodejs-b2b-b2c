# Production security enhancements
apiVersion: v1
kind: ConfigMap
metadata:
  name: marketplace-config
data:
  # Production URLs
  FRONTEND_URL: "https://marketplace.example.com"
  VITE_API_URL: "https://api.marketplace.example.com"

  # Enhanced security settings
  JWT_EXPIRES_IN: "15m"  # Shorter token expiry in production
  JWT_REFRESH_EXPIRES_IN: "7d"

---
# Network policies for production security
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: marketplace-network-policy
  namespace: marketplace
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow internal communication between services
  - from:
    - namespaceSelector:
        matchLabels:
          name: marketplace
    ports:
    - protocol: TCP
      port: 3000
    - protocol: TCP
      port: 3001
    - protocol: TCP
      port: 3002
    - protocol: TCP
      port: 3003
    - protocol: TCP
      port: 3004
    - protocol: TCP
      port: 3005
    - protocol: TCP
      port: 3006
    - protocol: TCP
      port: 3007
    - protocol: TCP
      port: 3008
    - protocol: TCP
      port: 3009
    - protocol: TCP
      port: 3010
  # Allow external access to gateway and admin dashboard
  - from: []
    ports:
    - protocol: TCP
      port: 4000
    - protocol: TCP
      port: 3000
  egress:
  # Allow DNS resolution
  - to: []
    ports:
    - protocol: UDP
      port: 53
  # Allow external API calls (for payments, shipping, etc.)
  - to: []
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80

---
# Pod security standards
apiVersion: policy/v1beta1
kind: PodSecurityPolicy
metadata:
  name: marketplace-psp
  namespace: marketplace
spec:
  privileged: false
  allowPrivilegeEscalation: false
  requiredDropCapabilities:
    - ALL
  volumes:
    - 'configMap'
    - 'emptyDir'
    - 'projected'
    - 'secret'
    - 'downwardAPI'
    - 'persistentVolumeClaim'
  runAsUser:
    rule: 'MustRunAsNonRoot'
  seLinux:
    rule: 'RunAsAny'
  supplementalGroups:
    rule: 'MustRunAs'
    ranges:
    - min: 1
      max: 65535
  fsGroup:
    rule: 'MustRunAs'
    ranges:
    - min: 1
      max: 65535